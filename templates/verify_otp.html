<!DOCTYPE html>
<html>
<head>
    <title>OTP Verification - Zero Trust Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f0f1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .otp-card {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 40px rgba(255, 193, 7, 0.15);
        }
        .otp-card h2 {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-control {
            background: #0f0f1a;
            border: 1px solid #2a2a4a;
            color: #ffffff;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 22px;
            text-align: center;
            letter-spacing: 8px;
            font-weight: 700;
        }
        .form-control:focus {
            background: #0f0f1a;
            border-color: #ffc107;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.2);
        }
        .form-control::placeholder {
            color: #4a4a6a;
            letter-spacing: 4px;
            font-size: 16px;
        }
        .form-label {
            color: #adb5bd;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .btn-verify {
            background: linear-gradient(135deg, #ffc107, #e0a800);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            color: #000;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .btn-verify:hover {
            background: linear-gradient(135deg, #e0a800, #c69500);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
            font-size: 14px;
        }
        .back-link a {
            color: #ffc107;
            text-decoration: none;
            font-weight: 600;
        }
        .badge-warning-custom {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .timer-text {
            color: #6c757d;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
        }
        .timer-text span {
            color: #ffc107;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="otp-card">

        <div class="text-center">
            <div style="font-size: 48px; margin-bottom: 10px;">🔑</div>
            <h2>OTP Verification</h2>
            <p class="subtitle">Medium Risk Detected — Please Verify</p>
            <div class="badge-warning-custom">⚠️ Extra Verification Required</div>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label text-center w-100">Enter 6-digit OTP</label>
                <input type="text" name="otp" class="form-control" placeholder="······" maxlength="6" required autofocus>
            </div>

            <button type="submit" class="btn-verify">✅ Verify OTP</button>
        </form>

        <div class="timer-text">
            OTP expires in <span>5 minutes</span>
        </div>

        <div class="back-link">
            <a href="/login">← Back to Login</a>
        </div>

    </div>
</body>
</html>
