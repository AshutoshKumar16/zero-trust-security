<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - Zero Trust Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { display: flex; align-items: center; justify-content: center; }
        .otp-card {
            background: var(--card);
            border: 1px solid rgba(250,204,21,0.2);
            border-radius: 20px; padding: 44px;
            width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .otp-logo {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #facc15, #fb923c);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin: 0 auto 20px;
            box-shadow: 0 4px 20px rgba(250,204,21,0.3);
        }
        .otp-input {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(250,204,21,0.3);
            color: #fff; border-radius: 10px;
            padding: 16px; width: 100%;
            font-size: 28px; font-weight: 800;
            text-align: center; letter-spacing: 10px;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.2s;
        }
        .otp-input:focus {
            outline: none;
            border-color: #facc15;
            box-shadow: 0 0 0 3px rgba(250,204,21,0.15);
        }
        .btn-otp {
            background: linear-gradient(135deg, #facc15, #fb923c);
            border: none; border-radius: 10px; padding: 13px;
            font-weight: 700; font-size: 15px; width: 100%;
            color: #000; margin-top: 16px; cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            box-shadow: 0 4px 20px rgba(250,204,21,0.3);
            transition: all 0.2s;
        }
        .btn-otp:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(250,204,21,0.4); }
        .timer { text-align: center; margin-top: 12px; color: var(--muted); font-size: 12px; }
    </style>
</head>
<body>
    <div class="otp-card">
        <div class="otp-logo">🔐</div>
        <h2 class="auth-title">Verify OTP</h2>
        <p class="auth-subtitle">Check your email for the 6-digit OTP</p>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Enter OTP</label>
                <input type="text" name="otp" class="otp-input" placeholder="••••••" maxlength="6" required autofocus>
            </div>
            <button type="submit" class="btn-otp">Verify →</button>
        </form>

        <div class="timer">⏱️ OTP valid for 5 minutes</div>
        <div class="auth-link" style="margin-top:12px">
            <a href="/login">← Back to Login</a>
        </div>
    </div>
</body>
</html>
