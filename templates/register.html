<!DOCTYPE html>
<html>
<head>
    <title>Register - Zero Trust Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-logo auth-logo-green">✨</div>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join Zero Trust Security System</p>

        <form method="POST">
            <div class="hp-field">
                <input type="text" name="website" tabindex="-1" autocomplete="off">
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Create a strong password" required>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="strength-text" id="strengthText">Enter password to check strength</div>
            </div>

            <button type="submit" class="btn-green">Create Account →</button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        initPasswordStrength('passwordInput', 'strengthFill', 'strengthText');
    </script>
</body>
</html>
