<!DOCTYPE html>
<html>
<head>
    <title>Register - Zero Trust Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0f1e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-card { background: #0d1530; border: 1px solid #1e2d50; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 0 40px rgba(61,122,237,0.1); }
        .register-card h2 { color: #e8f0fe; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #5b7ab5; font-size: 14px; margin-bottom: 30px; }
        .form-control { background: #0a0f1e; border: 1px solid #1e2d50; color: #e8f0fe; border-radius: 8px; padding: 12px 16px; }
        .form-control:focus { background: #0a0f1e; border-color: #198754; color: #e8f0fe; box-shadow: 0 0 0 3px rgba(25,135,84,0.2); }
        .form-control::placeholder { color: #2e4070; }
        .form-label { color: #7a9cc0; font-size: 13px; margin-bottom: 6px; }
        .btn-register { background: linear-gradient(135deg, #1a4a2e, #1e6e3a); border: none; border-radius: 8px; padding: 12px; font-weight: 600; font-size: 16px; width: 100%; color: #d0ffd8; margin-top: 10px; transition: all 0.3s; cursor: pointer; }
        .btn-register:hover { background: linear-gradient(135deg, #1e6e3a, #2a7a42); transform: translateY(-1px); }
        .login-link { text-align: center; margin-top: 20px; color: #5b7ab5; font-size: 14px; }
        .login-link a { color: #4caf7d; text-decoration: none; font-weight: 600; }
        .badge-secure { background: rgba(25,135,84,0.15); color: #4caf7d; border: 1px solid rgba(25,135,84,0.3); border-radius: 20px; padding: 4px 12px; font-size: 12px; display: inline-block; margin-bottom: 20px; }
        .hp-field { display: none !important; }

        /* Password strength */
        .strength-bar { height: 4px; border-radius: 2px; margin-top: 6px; transition: all 0.3s; background: #1e2d50; }
        .strength-text { font-size: 11px; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="text-center">
            <div style="font-size: 48px; margin-bottom: 10px;">🛡️</div>
            <h2>Create Account</h2>
            <p class="subtitle">Join Zero Trust Security System</p>
            <div class="badge-secure">🔐 Secured Registration</div>
        </div>

        <form method="POST">
            <!-- 🍯 HONEYPOT -->
            <div class="hp-field">
                <input type="text" name="website" tabindex="-1" autocomplete="off">
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Choose a strong password" required>
                <div class="strength-bar" id="strengthBar"></div>
                <div class="strength-text" id="strengthText"></div>
            </div>
            <button type="submit" class="btn-register">Create Account →</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>

<script>
    // Password strength meter
    const input = document.getElementById('passwordInput');
    const bar = document.getElementById('strengthBar');
    const text = document.getElementById('strengthText');

    input.addEventListener('input', function() {
        const val = this.value;
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        const levels = [
            { color: '#dc3545', label: '🔴 Weak', width: '25%' },
            { color: '#ffc107', label: '🟡 Fair', width: '50%' },
            { color: '#0dcaf0', label: '🔵 Good', width: '75%' },
            { color: '#198754', label: '🟢 Strong', width: '100%' }
        ];

        if (val.length === 0) {
            bar.style.width = '0';
            text.textContent = '';
            return;
        }

        const level = levels[Math.min(score - 1, 3)] || levels[0];
        bar.style.background = level.color;
        bar.style.width = level.width;
        text.style.color = level.color;
        text.textContent = level.label;
    });
</script>
</body>
</html>
