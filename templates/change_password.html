<!DOCTYPE html>
<html>
<head>
    <title>Change Password - Zero Trust Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { display: flex; align-items: center; justify-content: center; }
        .step-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 44px; width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .otp-input {
            background: rgba(255,255,255,0.04);
            border: 2px solid rgba(250,204,21,0.3);
            color: #fff; border-radius: 10px; padding: 16px; width: 100%;
            font-size: 28px; font-weight: 800; text-align: center; letter-spacing: 10px;
            font-family: 'Space Grotesk', sans-serif; transition: all 0.2s;
        }
        .otp-input:focus { outline: none; border-color: #facc15; box-shadow: 0 0 0 3px rgba(250,204,21,0.15); }
    </style>
</head>
<body>
    <div class="step-card">
        <div class="auth-logo auth-logo-blue" style="margin-bottom:20px">🔑</div>
        <h2 class="auth-title">Change Password</h2>

        {% if step == 'request_otp' %}
            <p class="auth-subtitle">We'll send an OTP to your registered email</p>
            <form method="POST">
                <input type="hidden" name="step" value="request_otp">
                <button type="submit" class="btn-primary">📧 Send OTP to Email</button>
            </form>

        {% elif step == 'verify_otp' %}
            <p class="auth-subtitle">Enter the OTP sent to your email</p>
            <form method="POST">
                <input type="hidden" name="step" value="verify_otp">
                <div class="mb-3">
                    <label class="form-label">Enter OTP</label>
                    <input type="text" name="otp" class="otp-input" placeholder="••••••" maxlength="6" required autofocus>
                </div>
                <button type="submit" class="btn-primary">Verify OTP →</button>
            </form>

        {% elif step == 'new_password' %}
            <p class="auth-subtitle">Create your new password</p>
            <form method="POST">
                <input type="hidden" name="step" value="new_password">
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" name="new_password" id="newPwd" class="form-control" placeholder="Enter new password" required>
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <div class="strength-text" id="strengthText">Enter password to check strength</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="btn-primary">Change Password ✓</button>
            </form>
        {% endif %}

        <div class="auth-link" style="margin-top:16px">
            <a href="/portal">← Back to Portal</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        initPasswordStrength('newPwd', 'strengthFill', 'strengthText');
    </script>
</body>
</html>
