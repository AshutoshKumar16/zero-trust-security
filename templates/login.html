<!DOCTYPE html>
<html>
<head>
    <title>Login - Zero Trust Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-logo auth-logo-blue">🛡️</div>
        <h2 class="auth-title">Zero Trust</h2>
        <p class="auth-subtitle">AI-Powered Security System</p>
        <div class="auth-badge">🔒 Never Trust, Always Verify</div>

        <form method="POST" id="loginForm">
            <div class="hp-field">
                <input type="text" name="website" tabindex="-1" autocomplete="off">
            </div>

            <input type="hidden" name="typing_speed" id="typingSpeed">
            <input type="hidden" name="typing_pattern" id="typingPattern">
            <input type="hidden" name="is_paste" id="isPaste" value="0">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Enter your password" required>
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-dot"></div>
                    <span class="typing-text">Start typing to analyze...</span>
                </div>
            </div>

            <button type="submit" class="btn-primary">Login →</button>
        </form>

        <div class="auth-link">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        initTypingDetection('passwordInput', 'typingIndicator', 'typingSpeed', 'typingPattern', 'isPaste');
    </script>
</body>
</html>
