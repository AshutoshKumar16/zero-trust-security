<!DOCTYPE html>
<html>
<head>
    <title>Login - Zero Trust Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0f1e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #0d1530; border: 1px solid #1e2d50; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 0 40px rgba(61,122,237,0.1); }
        .login-card h2 { color: #e8f0fe; font-weight: 700; margin-bottom: 8px; }
        .subtitle { color: #5b7ab5; font-size: 14px; margin-bottom: 30px; }
        .form-control { background: #0a0f1e; border: 1px solid #1e2d50; color: #e8f0fe; border-radius: 8px; padding: 12px 16px; }
        .form-control:focus { background: #0a0f1e; border-color: #3d7aed; color: #e8f0fe; box-shadow: 0 0 0 3px rgba(61,122,237,0.2); }
        .form-control::placeholder { color: #2e4070; }
        .form-label { color: #7a9cc0; font-size: 13px; margin-bottom: 6px; }
        .btn-login { background: linear-gradient(135deg, #1a3a6e, #1e4d8c); border: none; border-radius: 8px; padding: 12px; font-weight: 600; font-size: 16px; width: 100%; color: #cfe2ff; margin-top: 10px; transition: all 0.3s; cursor: pointer; }
        .btn-login:hover { background: linear-gradient(135deg, #1e4d8c, #2a5298); transform: translateY(-1px); }
        .register-link { text-align: center; margin-top: 20px; color: #5b7ab5; font-size: 14px; }
        .register-link a { color: #3d7aed; text-decoration: none; font-weight: 600; }
        .badge-secure { background: rgba(61,122,237,0.15); color: #6fa3f7; border: 1px solid rgba(61,122,237,0.3); border-radius: 20px; padding: 4px 12px; font-size: 12px; display: inline-block; margin-bottom: 20px; }
        /* Honeypot - hidden from humans */
        .hp-field { display: none !important; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center">
            <div style="font-size: 48px; margin-bottom: 10px;">🔐</div>
            <h2>Zero Trust</h2>
            <p class="subtitle">AI-Powered Security System</p>
            <div class="badge-secure">🛡️ Never Trust, Always Verify</div>
        </div>

        <form method="POST">
            <!-- 🍯 HONEYPOT FIELD - Hidden from humans, bots will fill it -->
            <div class="hp-field">
                <input type="text" name="website" tabindex="-1" autocomplete="off">
            </div>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login">Login →</button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>
</body>
</html>
